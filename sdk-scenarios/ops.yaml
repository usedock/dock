# Stable operation names shared by every SDK. Paths and body fields come from
# apps/backend/src/docks/ and apps/backend/src/retention/ (checked in CI).
# `{name}` in a path is an argument; `body` lists the argument names sent as JSON.
http:
  docks.create:
    method: POST
    path: /v1/docks
    status: 201
    body: [workspaceId, name, image, cpus, memoryMiB, diskGiB, ttlSeconds, env, connectors]
  docks.list:
    method: GET
    path: /v1/docks
    status: 200
    query: [filter, all]
  docks.get:
    method: GET
    path: /v1/docks/{dockId}
    status: 200
  docks.update:
    method: PATCH
    path: /v1/docks/{dockId}
    status: 200
    body: [name, cpus, memoryMiB, diskGiB, ttlSeconds]
  docks.exec:
    method: POST
    path: /v1/docks/{dockId}/exec
    status: 200
    body: [command, timeoutSeconds, env, cwd]
    # Optional; a replay with the same key returns the first result.
    optionalHeaders: [idempotency-key]
  docks.stop:
    method: POST
    path: /v1/docks/{dockId}/stop
    status: 202
    body: [force]
  docks.resume:
    method: POST
    path: /v1/docks/{dockId}/resume
    status: 202
    body: [cpus, memoryMiB, diskGiB, ttlSeconds, environment, noEnv]
  docks.branch:
    method: POST
    path: /v1/docks/{dockId}/branch
    status: 201
    body: [name, image, cpus, memoryMiB, diskGiB, ttlSeconds, env, environment, noEnv]
  docks.delete:
    method: DELETE
    path: /v1/docks/{dockId}
    status: 202
    # The value is the dock id being deleted; the API refuses the call without it.
    headers:
      x-confirm-delete: "{dockId}"
  docks.import:
    method: POST
    path: /v1/docks/import
    status: 201
    body: [workspaceId, name, image, cpus, memoryMiB, diskGiB, sizeBytes, sha256]
  # Raw part bytes as the body, not JSON; only for imports whose upload mode is proxy.
  docks.importPart:
    method: PUT
    path: /v1/docks/import/{importId}/parts/{number}
    status: 200
  docks.importComplete:
    method: POST
    path: /v1/docks/import/{importId}/complete
    status: 202
    body: [parts]
  docks.export:
    method: POST
    path: /v1/docks/{dockId}/export
    status: 202
  docks.exportGet:
    method: GET
    path: /v1/docks/exports/{exportId}
    status: 200
  # Streams the file, not JSON; used when exportGet returns a control-plane path as url.
  docks.exportDownload:
    method: GET
    path: /v1/docks/exports/{exportId}/download
    status: 200
  images.list:
    method: GET
    path: /v1/images
    status: 200
  connectors.list:
    method: GET
    path: /v1/workspaces/{workspaceId}/connectors
    status: 200
  connectors.connect:
    method: PUT
    path: /v1/workspaces/{workspaceId}/connectors/{kind}
    status: 200
    body: [token]
  connectors.disconnect:
    method: DELETE
    path: /v1/workspaces/{workspaceId}/connectors/{kind}
    status: 200
  connectors.oauthStart:
    method: GET
    path: /v1/connectors/{kind}/oauth/start
    status: 200
    query: [workspaceId]
  operations.get:
    method: GET
    path: /v1/operations/{operationId}
    status: 200

# The API has no file routes. SDK file helpers run one docks.exec call and
# reshape its result. `command` is the exact exec body. `{path}` is the path as
# one POSIX shell word: wrapped in single quotes, each ' inside written as '''
# (it's.txt -> 'it'''s.txt'). `{contentBase64}` is the base64 of the UTF-8
# content. `data` is what a step's `expect.data` is matched against.
composite:
  docks.files.write:
    via: docks.exec
    args: [dockId, path, content]
    command: "d=$(dirname -- {path}; echo x) && mkdir -p -- \"${d%??}\" && printf '%s' '{contentBase64}' | base64 -d > {path}"
    data:
      path: "{path}"
  docks.files.read:
    via: docks.exec
    args: [dockId, path]
    command: "base64 -w0 -- {path}"
    # stdout is base64; data.content is its UTF-8 decoding.
    data:
      content: "base64decode(stdout)"
  docks.files.list:
    via: docks.exec
    args: [dockId, path]
    command: "p={path} && case $p in /*) ;; *) p=./$p ;; esac && test -d \"$p\" && find -H \"$p\" -mindepth 1 -maxdepth 1 -exec sh -c 'for f; do printf \"%s\" \"${f##*/}\" | base64 -w0; echo; done' sh {} +"
    # A relative path gets ./ so find never reads it as an expression; -H follows
    # a symlinked directory. stdout is one base64-encoded entry name per line, in
    # no fixed order.
    # data.entries is each non-empty line base64-decoded to UTF-8, so names
    # holding newlines or other odd bytes survive.
    data:
      entries: "lines(stdout).map(base64decode)"
