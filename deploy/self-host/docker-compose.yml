# Self-hosted Dock control plane: Postgres, Redis, Restate, MinIO, the API
# (migrated on start, workflows registered with Restate), the dashboard, and
# Caddy serving both on one origin. Hosts join over the fleet API.
# From this directory: `./setup.sh` (writes .env, pulls and starts everything), or fill .env by hand
# and `docker compose up -d`. Images come from GHCR at DOCK_VERSION; to build from source add
# `-f docker-compose.yml -f docker-compose.build.yml` (setup.sh --build).
name: dock
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dock
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}'
      POSTGRES_DB: dock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dock -d dock']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Durable dock workflows for every host; never exposed publicly.
  restate:
    image: docker.restate.dev/restatedev/restate:1.7.13
    command: ['--node-name', 'restate-1']
    volumes:
      - restate-data:/restate-data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9070/health']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Snapshot generations; hosts reach them only through the API's object proxy.
  # Upstream MinIO no longer publishes images; pgsty/* is a maintained build of the same server.
  # MINIO_KMS_SECRET_KEY is MinIO's built-in static KMS key (`<key-name>:<base64 32 bytes>`) that
  # backs SSE-S3; minio-init turns on default bucket encryption with it. Losing the key makes
  # every stored snapshot unreadable, so keep .env backed up.
  minio:
    image: '${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: '${SNAPSHOT_STORE_ACCESS_KEY:?set SNAPSHOT_STORE_ACCESS_KEY}'
      MINIO_ROOT_PASSWORD: '${SNAPSHOT_STORE_SECRET_KEY:?set SNAPSHOT_STORE_SECRET_KEY}'
      MINIO_KMS_SECRET_KEY: '${MINIO_KMS_SECRET_KEY:?run ./setup.sh (or ./setup.sh --upgrade <version>) to add the snapshot encryption key to .env, then back up .env}'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: '${MINIO_CLIENT_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      SNAPSHOT_STORE_ACCESS_KEY: '${SNAPSHOT_STORE_ACCESS_KEY}'
      SNAPSHOT_STORE_SECRET_KEY: '${SNAPSHOT_STORE_SECRET_KEY}'
      SNAPSHOT_STORE_BUCKET: '${SNAPSHOT_STORE_BUCKET:-dock-snapshots}'
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set dock http://minio:9000 "$$SNAPSHOT_STORE_ACCESS_KEY" "$$SNAPSHOT_STORE_SECRET_KEY" &&
        mc mb --ignore-existing "dock/$$SNAPSHOT_STORE_BUCKET" &&
        mc encrypt set sse-s3 "dock/$$SNAPSHOT_STORE_BUCKET"
    restart: 'no'

  # Applies pending Drizzle migrations, then exits; the API waits for it.
  migrate:
    image: 'ghcr.io/usedock/dock-api-migrate:${DOCK_VERSION:?set DOCK_VERSION}'
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgres://dock:${POSTGRES_PASSWORD}@db:5432/dock'
    command: ['bun', 'run', 'db:migrate']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    image: 'ghcr.io/usedock/dock-api:${DOCK_VERSION:?set DOCK_VERSION}'
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgres://dock:${POSTGRES_PASSWORD}@db:5432/dock'
      REDIS_URL: redis://redis:6379
      PUBLIC_API_URL: '${DOCK_PUBLIC_URL:?set DOCK_PUBLIC_URL}'
      PUBLIC_APP_URL: '${DOCK_PUBLIC_URL}'
      RUNTIME_DRIVER: restate
      RESTATE_INGRESS_URL: http://restate:8080
      FLEET_TOKEN: '${FLEET_TOKEN:?set FLEET_TOKEN}'
      SNAPSHOT_STORE_ENDPOINT: '${SNAPSHOT_STORE_ENDPOINT:-http://minio:9000}'
      SNAPSHOT_STORE_BUCKET: '${SNAPSHOT_STORE_BUCKET:-dock-snapshots}'
      SNAPSHOT_STORE_ACCESS_KEY: '${SNAPSHOT_STORE_ACCESS_KEY}'
      SNAPSHOT_STORE_SECRET_KEY: '${SNAPSHOT_STORE_SECRET_KEY}'
      SNAPSHOT_STORE_PUBLIC_ENDPOINT: '${SNAPSHOT_STORE_PUBLIC_ENDPOINT:-}'
      # env_file passes all of .env; only minio needs the snapshot encryption key.
      MINIO_KMS_SECRET_KEY: ''
      # SSH gateway; published directly since Caddy only proxies HTTP.
      SSH_GATEWAY_PORT: 2222
      SSH_PUBLIC_PORT: '${DOCK_SSH_PORT:-2222}'
      # Hosted ports; Caddy serves *.DOCK_PORTS_DOMAIN and forwards here. Empty disables them.
      PORTS_DOMAIN: '${DOCK_PORTS_DOMAIN:-}'
      PORTS_PROXY_PORT: 8001
    ports:
      - '${DOCK_SSH_PORT:-2222}:2222'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      restate:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Registers the API's workflow endpoint (9080) with Restate on every start.
  restate-register:
    image: curlimages/curl:8.22.0
    depends_on:
      backend:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        body='{"uri":"http://backend:9080","force":true}'
        for i in $$(seq 1 30); do
          curl -fsS -X POST http://restate:9070/deployments -H 'content-type: application/json' -d "$$body" && exit 0
          sleep 2
        done
        echo 'restate registration failed' >&2
        exit 1
    restart: 'no'

  dashboard:
    image: 'ghcr.io/usedock/dock-dashboard:${DOCK_VERSION:?set DOCK_VERSION}'
    environment:
      NODE_ENV: production
      BETTER_AUTH_BACKEND_URL: http://backend:8000
      DOCK_PUBLIC_URL: '${DOCK_PUBLIC_URL}'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # One origin for the dashboard and API, so no CORS; automatic HTTPS for public names.
  caddy:
    image: caddy:2
    environment:
      DOCK_SITE_ADDRESS: '${DOCK_SITE_ADDRESS:?set DOCK_SITE_ADDRESS}'
      DOCK_PORTS_SITE_ADDRESS: '${DOCK_PORTS_SITE_ADDRESS:-*.${DOCK_PORTS_DOMAIN:-ports.invalid}}'
    # Host and container ports match so a site address with a port (http://localhost:8088) works.
    ports:
      - '${DOCK_HTTP_PORT:-80}:${DOCK_HTTP_PORT:-80}'
      - '${DOCK_HTTPS_PORT:-443}:${DOCK_HTTPS_PORT:-443}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - dashboard
    restart: unless-stopped

volumes:
  pgdata:
  restate-data:
  minio-data:
  caddy-data:
  caddy-config:
