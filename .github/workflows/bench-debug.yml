name: Bench debug

on:
  pull_request:
    paths:
      - .github/workflows/bench-debug.yml

permissions:
  contents: read

jobs:
  branch-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCK_DATA_DIR: /home/runner/dockdata
      DOCK_BENCH_MEMORY_MIB: "1024"
    steps:
      - name: install qemu
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: allow /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: install dock
        env:
          DOCK_VERSION: v0.3.2
        run: |
          curl -fsSL https://usedock.io/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: bench
      - name: branch scenario with a watchdog
        working-directory: bench
        run: |
          dock images pull ubuntu-24.04
          (while sleep 20; do echo "--- $(date +%T)"; dock ls --all | cat; pgrep -fc qemu-system; ps -eo pid,etime,stat,args | grep -E "dock (new|exec|branch|rm|stop|resume)" | grep -v grep | cut -c1-120; done) &
          timeout 500 bun run bench --provider dock-local --scenario branch-10 --iterations 3 || echo "bench exit $?"
      - name: state
        if: always()
        run: |
          free -m; df -h /home | cat
          dock ls --all | cat
          for id in $(dock ls --all --json | grep -o '"id": "[^"]*"' | cut -d'"' -f4 | head -3); do echo "=== $id"; timeout 30 dock exec $id -- systemctl status ssh --no-pager | tail -15; done || true
          for f in "$DOCK_DATA_DIR"/docks/*/serial.log; do echo "=== $f"; tail -25 "$f"; break; done || true
