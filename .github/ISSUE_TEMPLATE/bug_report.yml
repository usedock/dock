name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, image tag or commit, if you know it.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Host OS, runtime (microvm or gvisor), self-hosted or Dock Cloud.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
